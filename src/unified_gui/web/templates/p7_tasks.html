{% extends "base.html" %}
{% block subtitle %}Tasks{% endblock %}
{% block content %}
<h1>Tasks <span class="muted">aggregiert mit Provenienz — Zuweisung geht an die Quelle</span></h1>

<div class="toolbar">
    <label>Status:
        <select id="t-status" onchange="loadTasks()">
            <option value="all">alle</option>
            <option value="pending">pending/open</option>
            <option value="done">done</option>
        </select>
    </label>
    <span id="t-sources" class="muted small-text"></span>
</div>

<div id="task-list"><div class="muted">Lade ...</div></div>
{% endblock %}

{% block scripts %}
<script>
const PROV_LABEL = {bach: "BACH", scanner: "Scanner"};

// Nur der Projektordner statt des vollen Pfades — der Rest steht im title-Tooltip.
function projectName(path) {
    const parts = String(path || "").split(/[\\/]/).filter(Boolean);
    return parts.length ? parts[parts.length - 1] : "";
}

function text(value) {
    return value == null ? "" : String(value);
}

function chip(label, className = "chip", title = "") {
    const element = document.createElement("span");
    element.className = className;
    element.textContent = label;
    if (title) element.title = title;
    return element;
}

// effort/scope entscheiden, ob ein autonomer Loop die Aufgabe ueberhaupt anfasst:
// Ohne effort bleibt sie liegen — das muss man sehen, sonst sucht man den Grund
// vergeblich. Darum der Warn-Chip statt eines leeren Feldes.
function taskChips(t) {
    const chips = document.createElement("div");
    chips.className = "chips";
    if (t.effort) {
        chips.append(chip(text(t.effort)));
    } else if (t.provenance === "scanner") {
        chips.append(chip("uneingestuft", "chip verdict-ask",
            "Kein effort gesetzt — die autonomen Loops fassen diese Aufgabe nicht an"));
    }
    if (t.scope) chips.append(chip(text(t.scope)));
    if (t.project_path) {
        const label = (t.root_id ? text(t.root_id) + " / " : "") + projectName(t.project_path);
        chips.append(chip(label, "chip", text(t.project_path)));
    }
    return chips;
}

function taskRow(t) {
    const row = document.createElement("div");
    row.className = "rule";

    const details = document.createElement("span");
    const headline = document.createElement("div");
    headline.append(chip(text(PROV_LABEL[t.provenance] || t.provenance)));
    headline.append(document.createTextNode(" "));
    const id = document.createElement("b");
    id.textContent = "#" + text(t.id);
    headline.append(id, document.createTextNode(" " + text(t.title)));

    const metadata = [text(t.status), t.priority ? text(t.priority) : "",
        t.assigned_to ? "→ " + text(t.assigned_to) : ""].filter(Boolean).join(" · ");
    if (metadata) {
        const muted = document.createElement("span");
        muted.className = "muted small-text";
        muted.textContent = " " + metadata;
        headline.append(muted);
    }
    details.append(headline, taskChips(t));

    const actions = document.createElement("span");
    actions.className = "row";
    const assign = document.createElement("button");
    assign.className = "btn tiny";
    assign.textContent = "Zuweisen";
    assign.addEventListener("click", () => assignTask(t.provenance, t.id));
    const done = document.createElement("button");
    done.className = "btn tiny";
    done.textContent = "Done";
    done.addEventListener("click", () => doneTask(t.provenance, t.id));
    actions.append(assign, done);

    row.append(details, actions);
    return row;
}

async function loadTasks() {
    try {
        const status = document.getElementById("t-status").value;
        const data = await api("/api/p7/tasks?status=" + encodeURIComponent(status));
        document.getElementById("t-sources").textContent = data.sources.map(s =>
            `${s.name}: ${s.available ? s.count + " Tasks" : "offline"}${s.error ? " (" + s.error + ")" : ""}`
        ).join(" · ");
        const list = document.getElementById("task-list");
        const tasks = Array.isArray(data.tasks) ? data.tasks : [];
        if (tasks.length) {
            list.replaceChildren(...tasks.map(taskRow));
        } else {
            const empty = document.createElement("div");
            empty.className = "muted";
            empty.textContent = "Keine Tasks.";
            list.replaceChildren(empty);
        }
    } catch (e) { flash(e.message, true); }
}

async function assignTask(provenance, id) {
    const target = prompt("Zuweisen an (Agent/Partner, z. B. CLAUDE, GEMINI, sonnet-worker):");
    if (!target) return;
    try {
        await api("/api/p7/assign", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({provenance, id, target})});
        flash("Zugewiesen (kann bei BACH einige Sekunden dauern)");
        loadTasks();
    } catch (e) { flash(e.message, true); }
}

async function doneTask(provenance, id) {
    if (!confirm("#" + id + " als erledigt markieren?")) return;
    try {
        await api("/api/p7/done", {method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({provenance, id})});
        flash("Erledigt");
        loadTasks();
    } catch (e) { flash(e.message, true); }
}

loadTasks();
</script>
{% endblock %}
