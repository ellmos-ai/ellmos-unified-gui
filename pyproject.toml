[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-unified-gui"
version = "0.5.0"
description = "Importable operator console for the ellmos/BACH ecosystem (capability-driven web panels over existing backends)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lukas Geiger" }]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.27"]

[project.scripts]
unified-gui = "unified_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unified_gui = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
