[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-unified-gui"
version = "0.8.0"
description = "Importable operator console for the ellmos/BACH ecosystem (capability-driven web panels over existing backends)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Lukas Geiger" }]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
]

[project.optional-dependencies]
serve = ["uvicorn>=0.27"]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.12",
    "tomli>=2; python_version < '3.11'",
    "twine>=6",
    "uvicorn>=0.27",
]

[project.urls]
Repository = "https://github.com/ellmos-ai/unified-gui"
Issues = "https://github.com/ellmos-ai/unified-gui/issues"

[project.scripts]
unified-gui = "unified_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unified_gui = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
